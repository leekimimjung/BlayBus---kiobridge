# workspace/LEEKIMIMJUNG/ 에서 실행하세요: docker compose up -d / docker compose down
# cloudflared 서비스를 쓰려면 먼저 라즈베리파이에서 `cloudflared tunnel login` ~
# `tunnel route dns` 까지 한 번은 CLI로 실행해서 ~/.cloudflared 에 인증서·터널
# credentials·config.yml 이 만들어져 있어야 합니다 (DEPLOY_RASPBERRYPI.md 참고).
# config.yml의 service 값은 host가 아니라 컨테이너 이름을 써야 합니다: http://web:80
services:
  web:
    build:
      context: .
      dockerfile: web-app/Dockerfile
    container_name: leekimimjung-web
    ports:
      - "1001:80"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: leekimimjung-tunnel
    # 공식 이미지는 기본적으로 non-root(65532)로 도는데, 마운트한 ~/.cloudflared는
    # 호스트에서 사용자 전용 권한(600)이라 그 상태로는 못 읽습니다 — root로 실행해서 해결.
    user: "0:0"
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ${HOME}/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - web
    restart: unless-stopped
